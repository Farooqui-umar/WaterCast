<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Official sign-in - WaterCaste</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2d4093">
<link rel="stylesheet" href="/static/css/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/login.css?v={{ asset_v }}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand" id="brandLogo">
      <span class="brand-icon">
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lbadgeGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b93e8"/>
      <stop offset="0.5" stop-color="#3768d6"/>
      <stop offset="1" stop-color="#1c3f9e"/>
    </linearGradient>
    <radialGradient id="lgloss" cx="0.35" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ldropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <filter id="ldshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a1f5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#lbadgeGrad)" stroke="#16306e" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="96" fill="url(#lgloss)"/>
  <g filter="url(#ldshadow)">
    <path d="M100,42 C100,42 62,98 62,128 C62,151.2 79.4,170 100,170 C120.6,170 138,151.2 138,128 C138,98 100,42 100,42 Z" fill="url(#ldropGrad)"/>
  </g>
  <g transform="translate(100,131)">
    <path d="M20.73,13.98 A25,25 0 1 1 20.73,-13.98 L10.78,-7.27 A13,13 0 1 0 10.78,7.27 Z" fill="#3aa0c9"/>
  </g>
</svg>
      </span>
      <span class="brand-name">WaterCaste</span>
    </a>
    <a href="/" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Home
    </a>
  </div>
</header>
<main id="main" class="stage">
  <div class="login-wrap">
    <section class="form-panel">
      <div id="loginView">
        <div class="form-title">Official Login</div>
        <div class="form-sub">Enter your credentials to continue.</div>
        <form id="loginForm" novalidate>
          <div class="field-label">USERNAME</div>
          <div class="input-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" type="text" placeholder="Enter username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus />
          </div>
          <div class="field-label">PASSWORD</div>
          <div class="input-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
            <button type="button" class="eye" id="eyeBtn" aria-label="Show password">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="error-box" id="errorBox">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="errorText">Invalid username or password.</span>
          </div>
          <button type="submit" class="btn-orange">
            Login
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2a1810" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>
        <div class="foot-note">Access is restricted to authorised officials only. <a href="/privacy" style="color:var(--orange);">Privacy</a></div>
      </div>
      <div class="granted" id="grantedView">
        <div class="tick">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2a1810" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Access granted</h2>
        <p>Welcome, <b id="whoName"></b>. Taking you to the dashboard - you can now manage help requests and community posts.</p>
        <p class="geo-status" id="geoStatus"></p>
      </div>
    </section>
  </div>
</main>
<script src="/static/js/login.js?v={{ asset_v }}"></script>
</body>
</html>
